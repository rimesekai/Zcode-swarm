<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241B10"/>
      <stop offset="1" stop-color="#120D07"/>
    </linearGradient>
    <linearGradient id="bee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <clipPath id="bodyClip"><ellipse cx="252" cy="292" rx="116" ry="88"/></clipPath>
  </defs>

  <!-- 背景圆角方块 -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 左上角小蜂巢 + 虚线飞行轨迹 -->
  <polygon points="108,72 142.6,92 142.6,132 108,152 73.4,132 73.4,92" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="9"/>
  <path d="M 120 156 C 150 220 185 235 216 236" fill="none" stroke="#FDE68A" stroke-width="6.5" stroke-linecap="round" stroke-dasharray="1 16" opacity="0.95"/>

  <!-- 小蜜蜂（整体前倾 10°） -->
  <g transform="rotate(-10 256 285)">
    <!-- 翅膀（画在身体后面） -->
    <ellipse cx="207" cy="181" rx="64" ry="38" transform="rotate(-26 207 181)" fill="#FFF7E6" opacity="0.92"/>
    <ellipse cx="296" cy="172" rx="60" ry="36" transform="rotate(-6 296 172)" fill="#FFF7E6" opacity="0.85"/>
    <!-- 尾刺 -->
    <polygon points="142,290 106,301 144,313" fill="#241708"/>
    <!-- 身体 -->
    <ellipse cx="252" cy="292" rx="116" ry="88" fill="url(#bee)"/>
    <!-- 黑纹（裁剪进身体） -->
    <g clip-path="url(#bodyClip)">
      <rect x="192" y="180" width="34" height="230" transform="rotate(7 209 295)" fill="#241708"/>
      <rect x="268" y="180" width="36" height="230" transform="rotate(7 286 295)" fill="#241708"/>
      <rect x="336" y="180" width="34" height="230" transform="rotate(7 353 295)" fill="#241708"/>
    </g>
    <!-- 头 + 眼睛 -->
    <circle cx="362" cy="254" r="56" fill="#2A1B0A"/>
    <circle cx="376" cy="240" r="10" fill="#FFF7E6"/>
    <!-- 触角 -->
    <path d="M 342 206 Q 322 162 300 152" fill="none" stroke="#241708" stroke-width="8" stroke-linecap="round"/>
    <path d="M 368 200 Q 370 154 392 136" fill="none" stroke="#241708" stroke-width="8" stroke-linecap="round"/>
    <circle cx="300" cy="152" r="7" fill="#241708"/>
    <circle cx="392" cy="136" r="7" fill="#241708"/>
  </g>
</svg>
